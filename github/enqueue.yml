# repo-baseline v2 enqueue workflow (github/README.md). Copy to .github/workflows/enqueue.yml.
# A cloud session cannot call GitHub GraphQL, so it cannot queue a PR. `baseline.py enqueue` there comments
# `/enqueue <reviewed head SHA>` on the PR instead, and this workflow runs the same checks as the local command
# (POLICY §5) on GitHub's side, queues the PR with expectedHeadOid, and answers in a PR comment.
# This file changes workflow permissions, so the PR that adds it is hard (POLICY §3) and the owner merges it.
#
# Why a comment and not workflow_dispatch: an issue_comment run always uses the workflow file and the
# .baseline/ copy on the default branch, so a PR cannot change the code that decides whether it may be queued.
# A dispatch run uses the file on whatever branch it is started from.
name: enqueue

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  enqueue:
    # Only a PR comment that starts with the command, from the owner, an organization member or a collaborator.
    # Without the author check anyone can start a run on a public repository by commenting. The script still
    # reads the comment from the event file and accepts nothing but `/enqueue <40 hex>` from someone with write
    # access; the text is never put in a shell.
    if: >-
      ${{ github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/enqueue ')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    # One group per comment. A group runs one job at a time and keeps one waiting job: a third request on the
    # same PR would cancel the waiting second one, and a cancelled request never gets an answer. Requests on the
    # same PR may now run side by side. That is safe: each run answers its own comment id, and the GraphQL call
    # carries expectedHeadOid, so a request can never queue another head. A PR is in the merge queue once, so a
    # later request for a PR that is already queued gets an error or the same result as the first.
    concurrency:
      group: enqueue-${{ github.event.comment.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # enqueuePullRequest and the collaborator permission lookup need push access
      pull-requests: write
      issues: write         # the answer comment
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: enqueue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .baseline/baseline.py enqueue-comment
